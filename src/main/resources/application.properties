spring.profiles.active=@spring.profiles.active@

server.port=8083

spring.application.name=paypal-provider-service

paypal.client.id="add your client id "
paypal.outh.url= "add your client secret "
paypal.outhurl= https://api-m.sandbox.paypal.com/v1/oauth2/token

paypal.createOrder.url=https://api-m.sandbox.paypal.com/v2/checkout/orders
paypal.capture.order.url=https://api-m.sandbox.paypal.com/v2/checkout/orders/{orderId}/capture


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true