spring.profiles.active=@spring.profiles.active@

server.port=8083

spring.application.name=paypal-provider-service

# ---- PayPal ----
# Credentials come from environment variables. NEVER hardcode them here.
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.oauth.url=https://api-m.sandbox.paypal.com/v1/oauth2/token
paypal.createOrder.url=https://api-m.sandbox.paypal.com/v2/checkout/orders
paypal.capture.order.url=https://api-m.sandbox.paypal.com/v2/checkout/orders/{orderId}/capture

# ---- Redis (local setup by default; override with env vars elsewhere) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# (only if your Redis has a password: set env var SPRING_DATA_REDIS_PASSWORD)
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# ---- PayPal access token cache ----
# Redis key where the OAuth access token is stored
paypal.token.redis-key=paypal:provider:oauth:access_token
# Expire the cached token this many seconds BEFORE PayPal says it expires
paypal.token.expiry-buffer-seconds=300

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# ---- Eureka (off by default so the service still runs standalone) ----
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never